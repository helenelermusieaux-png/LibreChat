version: "1.1.5" # Version du schéma de configuration requise pour la v1.3.x
cache: true

# 1. Configuration de l'interface personnalisée
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true          # Affichage de la sélection des fournisseurs en haut
  modelSelect: true            # Affichage de la sélection des modèles en haut
  parameters: true             # Affichage des paramètres en bas à gauche
  sidePanel: true              # Affichage du panneau latéral à droite
  presets: true                # Affichage des pré-configurations
  prompts: true                # Affichage de la bibliothèque de prompts
  bookmarks: true              # Affichage des favoris
  multiConvo: true             # Gestion de plusieurs conversations
  agents: true                 # Construction et partage d'agents (Icône Robot)
  runCode: true                # ACTIVÉ : Requis pour afficher le skill Code Interpreter
  webSearch: true              # ACTIVÉ : Requis pour afficher le skill Recherche Web
  fileSearch: true             # ACTIVÉ : Requis pour afficher le skill Analyse de fichiers

# 2. Moteur global des Agents (Placé à la racine, sorti de endpoints)
agents:
  enabled: true
  agentOptions:
    capabilities:
      - "context"
      - "tools"       # Déclenche l'affichage de la section "Skills" à l'écran
      - "artifacts"   # Panneau d'affichage dynamique de code/HTML

# 3. Définition des endpoints et fournisseurs personnalisés
endpoints:
  custom:             # Imbriqué sous 'endpoints' (Règle le ZodError/Crash de Render)
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
          - "google/gemma-4-26b-a4b-it:free"
          - "qwen/qwen3-coder:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
        fetch: false
      dropParams:
        - stop
      modelDisplayLabel: "OpenRouter"
