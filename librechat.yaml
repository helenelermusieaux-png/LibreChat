version: 1.3.5
cache: true
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "qwen/qwen3.6-plus:free"
          - "google/gemma-4-26b-it:free"
          - "google/gemini-2.0-flash-exp:free"
        fetch: false
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"
