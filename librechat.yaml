version: "1.3.2" # Version du schéma exigée par le validateur pour la v1.3.x
cache: true

# =====================================================================
# 1. INTERFACE : Active toutes les fonctionnalités graphiques à l'écran
# =====================================================================
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true          # Sélection des fournisseurs en haut
  modelSelect: true            # Sélection des modèles en haut
  parameters: true             # Settings / Paramètres (en bas à gauche)
  sidePanel: true              # Panneau latéral à droite
  presets: true                # Pré-configurations
  prompts: true                # Bibliothèque de prompts
  bookmarks: true              # Favoris
  multiConvo: true             # Gestion de plusieurs conversations
  agents: true                 # Construction et partage d'agents (Icône Robot)
  runCode: true                # REQUIS : Affiche le skill Code Interpreter
  webSearch: true              # REQUIS : Affiche le skill Recherche Web
  fileSearch: true             # REQUIS : Affiche le skill Analyse de fichiers (RAG)

# =====================================================================
# 2. AGENTS : Bloc racine obligatoire pour le moteur de compétences
# =====================================================================
agents:
  enabled: true
  agentOptions:                # Corrige le crash 'Unrecognized key(s) in object: agents'
    capabilities:
      - "context"
      - "tools"                # Déclenche l'affichage de la section "Skills" à l'écran
      - "artifacts"            # Panneau d'affichage dynamique de code/HTML

# =====================================================================
# 3. ENDPOINTS : Vos fournisseurs d'API (sans blocs d'interface imbriqués)
# =====================================================================
endpoints:
  custom:                      # Bien imbriqué sous endpoints pour éviter le ZodError
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
          - "google/gemma-4-26b-a4b-it:free"
          - "qwen/qwen3-coder:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
        fetch: false
      dropParams:
        - stop
      modelDisplayLabel: "OpenRouter"
