# Configuration version (required)
version: 1.3.13

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true   # Sélection des fournisseurs en haut
  modelSelect: true     # Sélection des modèles en haut
  parameters: true      # Settings en bas à gauche
  sidePanel: true        # Panneau de droite
  presets: true           # Pré-configurations
  prompts: true            # Bibliothèque de prompts
  bookmarks: true           # Favoris
  multiConvo: true           # Plusieurs conversations
  agents: true                 # Construction et partage d'agents
  skills: true                  # Active le panneau Skills côté UI
  runCode: false                  # Nécessaire si vos skills exécutent du code
  webSearch: false
  fileSearch: false

# Capacités des agents (c'est ICI que "skills" doit être déclaré,
# pas dans un "agentOptions" qui n'existe pas dans le schéma)
endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    capabilities:
      - 'context'
      - 'tools'
      - 'artifacts'
      - 'skills'
      
  custom:              # Bien imbriqué sous endpoints pour valider le schéma Zod
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
          - "google/gemma-4-26b-a4b-it:free"
          - "qwen/qwen3-coder:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
        fetch: false
      dropParams:
        - stop
      modelDisplayLabel: "OpenRouter"
