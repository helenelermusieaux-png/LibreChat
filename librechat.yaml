version: 1.3.2 # Ancienne version de schéma
cache: true

# Configuration de l'interface : On bloque l'affichage des compétences
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true       # L'onglet Robot apparaît...
  runCode: false     # ... mais le bouton Code Interpreter est masqué !
  webSearch: false   # ... mais le bouton Recherche Web est masqué !
  fileSearch: false  # ... mais le bouton Fichiers est masqué !

# L'ancien piège : On imbrique 'agents' dans 'endpoints' et on met 'custom' au bon endroit
endpoints:
  agents:
    capabilities:
      - "context"
      - "tools"       # Ignoré par le backend à cet endroit
      - "artifacts"   # Ignoré par le backend à cet endroit
  
  custom:             # Placé ici, Render ne crashe pas car il est bien sous 'endpoints'
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
        fetch: false
