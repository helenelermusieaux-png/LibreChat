version: 1.3.13 # On déclare la version exacte pour le validateur
cache: true

# =====================================================================
# 1. INTERFACE : Débloque toutes les icônes de la barre de gauche
# =====================================================================
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true       # Affiche l'icône Robot (Création d'agents)
  runCode: true      # Affiche l'interrupteur du skill Code Interpreter
  webSearch: true    # Affiche l'interrupteur du skill Recherche Web
  fileSearch: true   # Affiche l'interrupteur du skill RAG / Fichiers

# =====================================================================
# 2. AGENT OPTIONS : La syntaxe exacte racine requise par la v1.3.13
# =====================================================================
agentOptions:          # Remplace la clé "agents" qui faisait crasher Render
  capabilities:
    - "context"
    - "tools"          # Permet l'injection des Skills dans vos Agents
    - "artifacts"      # Active le panneau latéral droit (Style Claude)

# =====================================================================
# 3. ENDPOINTS : Vos connecteurs d'API
# =====================================================================
endpoints:
  custom:              # Bien imbriqué sous endpoints pour valider le schéma Zod
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
          - "google/gemma-4-26b-a4b-it:free"
          - "qwen/qwen3-coder:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
        fetch: false
      dropParams:
        - stop
      modelDisplayLabel: "OpenRouter"
