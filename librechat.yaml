# Configuration version (required)
version: 1.3.13
# Cache settings: Set to true to enable caching
cache: true
# Custom interface configuration
interface:
  customWelcome: "Bonjour {{user.name}}, comment puis-je vous aider ?"
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
  skills: true
  runCode: false
  webSearch: false
  fileSearch: false

# ⬇️ NOUVEAU BLOC — au même niveau que "interface" et "endpoints"
modelSpecs:
  list:
    - name: "general-assistant"
      label: "Assistant Général"
      default: true
      preset:
        endpoint: "OpenRouter"
        model: "google/gemma-4-31b-it:free"

    - name: "clientx-docanalysis"
      label: "ClientX - Analyse de documents"
      preset:
        endpoint: "OpenRouter"
        model: "nvidia/nemotron-3-super-120b-a12b:free"

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    capabilities:
      - 'context'
      - 'tools'
      - 'artifacts'
      - 'skills'

  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          - "google/gemma-4-31b-it:free"
          - "google/gemma-4-26b-a4b-it:free"
          - "qwen/qwen3-coder:free"
          - "nvidia/nemotron-3-super-120b-a12b:free"
        fetch: false
      dropParams:
        - stop
      modelDisplayLabel: "OpenRouter"
